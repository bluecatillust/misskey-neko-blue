name: Publish Misskey 2026.9.0 source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - misskey-2026.9.0-source.tar.zst

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4

      - name: Replace the repository with the prepared source snapshot
        if: ${{ hashFiles('misskey-2026.9.0-source.tar.zst') != '' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/misskey-source /tmp/publish-workflow
          tar --zstd -xf misskey-2026.9.0-source.tar.zst -C /tmp/misskey-source
          cp .github/workflows/publish-2026.9.0.yml /tmp/publish-workflow/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/misskey-source/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/publish-workflow/publish-2026.9.0.yml .github/workflows/
          git config user.name "bluecatillust"
          git config user.email "242743171+bluecatillust@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade to Misskey 2026.9.0 with neko.blue changes"
          git push origin HEAD:main
